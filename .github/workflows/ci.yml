name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'flake.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Lint, compile & test
        run: |
          nix develop -c bash -c '
            set -e
            mix local.hex --force > /dev/null
            mix local.rebar --force > /dev/null
            mix deps.get
            mix precommit
          '

  assets:
    name: Assets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: mix-assets-${{ runner.os }}-${{ hashFiles('mix.lock', 'flake.lock') }}
          restore-keys: mix-assets-${{ runner.os }}-

      - name: Build assets
        run: |
          nix develop -c bash -c '
            set -e
            mix local.hex --force > /dev/null
            mix local.rebar --force > /dev/null
            mix deps.get
            mix compile
            mix assets.deploy
          '
